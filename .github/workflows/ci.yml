name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-mac:
    runs-on: macos-latest
    env:
      ACTIONS_ALLOW_NODE_24: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements/requirements-*.txt'

      - name: Install ffmpeg
        run: |
          brew install ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-mac.txt

      - name: Download models
        run: |
          python scripts/download_models.py scrfd_2.5g_bnkps.onnx scrfd_10g_bnkps.onnx


      - name: Run pytest
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen pytest -v --tb=short > pytest.log 2>&1
          EXIT_CODE=$?
          cat pytest.log
          if [ $EXIT_CODE -ne 0 ]; then
            FAILURES=$(grep -A 20 -m 1 "FAILURES" pytest.log | tr '\n' ' ')
            echo "::error title=Pytest Error::$FAILURES"
          fi
          exit $EXIT_CODE




